    async function showYearBreakdown(year) {
        const container = document.getElementById('yearBreakdownContainer');
        if (!container) return;
        
        const chars = await getChars();
        const meta = await getFranchiseMeta();
        
        let yearChars = [];
        chars.forEach(char => {
            const faInfo = extractYearAndTitle(char.firstApp);
            if (faInfo.year === year) yearChars.push(char);
        });
        if (yearChars.length === 0) return;

        let mediaGroups = {};
        yearChars.forEach(char => {
            const faInfo = extractYearAndTitle(char.firstApp);
            const baseTitle = faInfo.title.replace(/\s*S\d+E\d+/i, '').trim();
            if (!mediaGroups[baseTitle]) mediaGroups[baseTitle] = [];
            mediaGroups[baseTitle].push(char);
        });

        let yearHtml = '';
        Object.keys(mediaGroups).sort().forEach(mediaTitle => {
            let groupChars = mediaGroups[mediaTitle].sort((a,b) => a.name.localeCompare(b.name));
            if (groupChars.length > 1) {
                let matchedLogo = null;
                for (let i = 0; i < chars.length; i++) {
                    if (Array.isArray(chars[i].lbo)) {
                        let foundLbo = chars[i].lbo.find(m => {
                            if (!m.media || !m.logo) return false;
                            let cleanLbo = m.media.replace(/\s*\(\d{4}\)\s*$/, '').trim().toLowerCase();
                            let cleanTitle = mediaTitle.replace(/\s*\(\d{4}\)\s*$/, '').trim().toLowerCase();
                            return cleanLbo === cleanTitle || cleanTitle.includes(': ' + cleanLbo) || cleanLbo.includes(': ' + cleanTitle) || cleanTitle.includes(' - ' + cleanLbo) || cleanLbo.includes(' - ' + cleanTitle);
                        });
                        if (foundLbo) { matchedLogo = foundLbo.logo; break; }
                    }
                }
                if (!matchedLogo) {
                    let sampleChar = groupChars[0];
                    let cleanTitle = mediaTitle.replace(/\s*\(\d{4}\)\s*$/, '').trim().toLowerCase();
                    let cleanFranchise = sampleChar.universe.trim().toLowerCase();
                    if (cleanTitle === cleanFranchise && meta[sampleChar.universe] && meta[sampleChar.universe].logo) {
                        matchedLogo = meta[sampleChar.universe].logo;
                    }
                }

                let titleDisplay = matchedLogo 
                    ? `<img src="${matchedLogo}" style="max-height: 25px; max-width: 150px; object-fit: contain; vertical-align: middle; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));" alt="${mediaTitle}" onerror="this.outerHTML='🎬 ${mediaTitle.replace(/'/g, "\\'")}'">`
                    : `${mediaTitle}`;

                yearHtml += `
                    <div style="width: 100%; flex-basis: 100%;">
                        <button type="button" class="btn secondary small" style="width: 100%; text-align: left; display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; border-color: var(--primary);" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'flex' : 'none'">
                            <span style="font-size: 0.95rem; display: flex; align-items: center;">${titleDisplay}</span>
                            <span style="font-size: 0.8rem; color: var(--text-muted);">${groupChars.length} Characters ▼</span>
                        </button>
                        <div class="timeline-char-list" style="display: none; padding: 12px; background: rgba(0,0,0,0.2); border-radius: 8px; border: 1px dashed var(--glass-border); margin-bottom: 10px;">
                            ${groupChars.map(char => `<div class="timeline-char-pill" onclick="openPage(${char.id})">${char.name} <small>(${char.universe})</small></div>`).join('')}
                        </div>
                    </div>`;
            } else {
                let char = groupChars[0];
                yearHtml += `<div class="timeline-char-pill" onclick="openPage(${char.id})">${char.name} <small>(${char.universe})</small></div>`;
            }
        });

        let html = `
        <div class="stats-panel" style="animation: fadeIn 0.3s ease;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; margin-bottom: 15px;">
                <h3 style="margin: 0; border: none; padding: 0;">Characters from <span style="color:#fff;">${year}</span></h3>
                <button class="btn small secondary" onclick="document.getElementById('yearBreakdownContainer').style.display='none'">✕ Close</button>

                ${yearHtml}
            </div>
        </div>`;
        
        container.innerHTML = html;
        container.style.display = 'block';
        
        const mainContent = document.querySelector('.main-content');
        if (mainContent) {
            const scrollTarget = container.getBoundingClientRect().top + mainContent.scrollTop - mainContent.getBoundingClientRect().top - 20;
            mainContent.scrollTo({ top: scrollTarget, behavior: 'smooth' });
        }

    async function showFranchiseBreakdown(medium) {
        const container = document.getElementById('franchiseBreakdownContainer');
        if (!container) return;
        
        const chars = await getChars();
        const meta = await getFranchiseMeta();
        
        const franchiseCounts = {};
        let totalInMedium = 0;
        
        chars.forEach(c => {
            const uni = c.universe;
            const mData = meta[uni] || {};
            const m = mData.medium || "Uncategorized";
            
            if (m === medium) {
                franchiseCounts[uni] = (franchiseCounts[uni] || 0) + 1;
                totalInMedium++;
            }
        });
        
        let sortedFranchises = Object.entries(franchiseCounts).sort((a, b) => b[1] - a[1]);
        const MAX_SLICES = 10;
        if (sortedFranchises.length > MAX_SLICES) {
            const top = sortedFranchises.slice(0, MAX_SLICES);
            const remaining = sortedFranchises.slice(MAX_SLICES);
            const otherCount = remaining.reduce((sum, item) => sum + item[1], 0);
            top.push(["Other", otherCount]);
            sortedFranchises = top;
        }
        
        let currentOffset = 0;
        let legendHtml = `<div class="pie-legend">`;
        const chartColors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#a55eea', '#535c68', '#ff6b81', '#7bed9f', '#eccc68', '#ff7f50', '#a4b0be'];

        let svgHtml = `<svg viewBox="0 0 42 42" style="width:180px; height:180px; transform: rotate(-90deg); filter: drop-shadow(0 5px 15px rgba(0,0,0,0.4)); overflow: visible; border-radius:50%;">
            <circle cx="21" cy="21" r="15.915" fill="#131518" />`;

        sortedFranchises.forEach((item, index) => {
            const name = item[0];
            const count = item[1];
            const percent = (count / totalInMedium) * 100;
            const color = name === "Other" ? "#57606f" : chartColors[index % chartColors.length];
            const offset = 100 - currentOffset;

            const isOther = name === "Other";
            const clickAction = isOther ? "" : `onclick="viewFranchise('${name.replace(/'/g, "\\'")}')"`;
            const cursorStyle = isOther ? "cursor: default;" : "cursor: pointer;";

            svgHtml += `
                <circle class="pie-slice franchise-slice" cx="21" cy="21" r="15.915" fill="none" stroke="${color}" stroke-width="7"
                    stroke-dasharray="0 100" stroke-dashoffset="${offset}" data-target-array="${percent} ${100 - percent}"
                    style="transition: stroke-dasharray 1s cubic-bezier(0.2, 0.8, 0.2, 1), stroke-width 0.2s, transform 0.2s; transform-origin: center; pointer-events: stroke; ${cursorStyle}"
                    ${clickAction} onmouseover="this.style.strokeWidth='9'; this.style.transform='scale(1.05)';" onmouseout="this.style.strokeWidth='7'; this.style.transform='scale(1)';">
                    <title>${name} (${Math.round(percent)}%)</title>
                </circle>`;

            currentOffset += percent;
            legendHtml += `
                <div class="legend-item" style="padding:4px 8px; border-radius:6px; transition:all 0.2s; margin-left:-8px; ${cursorStyle}" 
                    ${clickAction} onmouseover="this.style.background='rgba(255,255,255,0.1)'; this.style.transform='translateX(5px)';" onmouseout="this.style.background='transparent'; this.style.transform='none';">
                    <div class="legend-dot" style="background:${color}"></div>
                    <span>${name} <small>(${Math.round(percent)}%)</small></span>
                </div>`;
        });
        svgHtml += `</svg>`;
        legendHtml += `</div>`;
        
        let html = `
        <div class="stats-panel" style="animation: fadeIn 0.3s ease;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; margin-bottom: 15px;">
                <h3 style="margin: 0; border: none; padding: 0;">Franchise Breakdown: <span style="color:#fff;">${medium}</span></h3>
                <button class="btn small secondary" onclick="document.getElementById('franchiseBreakdownContainer').style.display='none'">✕ Close</button>
            </div>
            <div style="color: #aaa; margin-bottom: 15px; font-size: 0.9rem;">Total Characters: <strong style="color:var(--accent);">${totalInMedium}</strong></div>
            <div class="pie-container">
                ${svgHtml}
                ${legendHtml}
            </div>
        </div>`;
        
       container.innerHTML = html;
        container.style.display = 'block';
        
        const mainContent = document.querySelector('.main-content');
        if (mainContent) {
            const scrollTarget = container.getBoundingClientRect().top + mainContent.scrollTop - mainContent.getBoundingClientRect().top - 20;
            mainContent.scrollTo({ top: scrollTarget, behavior: 'smooth' });
        }
        
        setTimeout(() => {
            const slices = container.querySelectorAll('.franchise-slice');
            slices.forEach(slice => { slice.style.strokeDasharray = slice.getAttribute('data-target-array'); });
        }, 50);
    }

    function init3DTiltForElement(el) {
        el.dataset.tiltAttached = "true";
        el.classList.add('tilted-element');
        el.addEventListener('mousemove', (e) => {
            if(el.classList.contains('virtual-empty')) return;
            const rect = el.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const rotateX = ((y - centerY) / centerY) * -8; 
            const rotateY = ((x - centerX) / centerX) * 8;
            el.style.transition = 'transform 0.05s linear'; 
            el.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.04, 1.04, 1.04)`;
        });
        el.addEventListener('mouseleave', () => {
            el.style.transition = 'transform 0.4s ease-out'; 
            el.style.transform = ''; 
        });
    }

    async function copyCharacterText(id) {
        const chars = await getChars();
        const char = chars.find(c => c.id === id);
        if(!char) return;

        const gStats = buildGannoidStats(chars);
        const gCost = calculateGannoids(char, gStats).toLocaleString();

        let text = `${char.name}`;
        if(char.title) text += ` "${char.title}"`;
        text += `\n`;
        if(char.realName) text += `Real Name: ${char.realName}\n`;
        text += `Universe: ${char.universe}\n`;
        if(char.subcategory) text += `Subcategory: ${char.subcategory}\n`;
        if(char.firstApp) text += `First Appearance: ${char.firstApp}\n`;
        if(char.quote) text += `Quote: "${char.quote}"\n`;
        text += `Gannoids Value: ${gCost}\n`;
        if(char.bio) text += `\n--- Biography ---\n${char.bio}\n`;

        if(char.owl || char.um || char.coopUm || char.vu || char.lbo || char.skins) {
            text += `\n--- GWC Mechanics ---\n`;
            if(char.owl) text += `Open World Location (OWL): ${char.owl}\n`;
            if(char.um) text += `Ultimate Move (UM): ${char.um}\n`;
            if(char.coopUm) {
                const partner = chars.find(c => c.id == char.coopUm.partnerId);
                const partnerName = partner ? partner.name : "Unknown Partner";
                text += `Co-Op UM (with ${partnerName}): ${char.coopUm.name}\n`;
            }
            if(char.vu) text += `Vehicle (VU): ${char.vu}\n`;

            if(char.lbo) {
                text += `\nLevels Based Off (LBO):\n`;
                if(typeof char.lbo === 'object') {
                    char.lbo.forEach(media => {
                        text += `• ${media.media}\n`;
                        media.levels.forEach((lvl, idx) => {
                            if(lvl.title || lvl.desc) text += `  ${idx+1}. ${lvl.title ? lvl.title + ': ' : ''}${lvl.desc}\n`;
                        });
                    });
                } else {
                    text += `${char.lbo}\n`;
                }
            }

            if(char.skins) {
                text += `\nSkins:\n`;
                const tree = parseSkinTree(char.skins);
                let skinLines = [];
                function walkSkins(items, path) {
                    items.forEach(item => {
                        if(typeof item === 'string') {
                            skinLines.push(path ? `${path} > ${item}` : item);
                        } else if(item.type === 'category') {
                            walkSkins(item.items, path ? `${path} > ${item.name}` : item.name);
                        }
                    });
                }
                walkSkins(tree, "");
                skinLines.forEach(line => text += `• ${line}\n`);
            }
        }

        try {
            await navigator.clipboard.writeText(text);
            const btn = document.getElementById('copyCharBtn');
            if(btn) {
                const originalText = btn.innerText;
                btn.innerText = "Copied!";
                setTimeout(() => { btn.innerText = originalText; }, 2000);
            }
        } catch(e) { alert("Failed to copy to clipboard."); }
    }

    /* --- PARSER --- */
    function parseSkinTree(str) {
        if (!str) return [];
        let root = { type: 'root', items: [] };
        let stack = [root];
        let token = "";
        
        for (let i = 0; i < str.length; i++) {
            let char = str[i];
            if (char === ';' && str[i+1] === '(') {
                let catName = token.trim();
                let newCat = { type: 'category', name: catName, items: [] };
                stack[stack.length - 1].items.push(newCat);
                stack.push(newCat);
                token = "";
                i++; 
            } else if (char === ')') {
                if (token.trim()) stack[stack.length - 1].items.push(token.trim());
                token = "";
                if (stack.length > 1) stack.pop();
            } else if (char === ',') {
                if (token.trim()) stack[stack.length - 1].items.push(token.trim());
                token = "";
            } else {
                token += char;
            }
        }
        if (token.trim() && stack.length > 0) stack[stack.length - 1].items.push(token.trim());
        return root.items;
    }

    function formatSkins(skinString, char) {
        if(!skinString) return ''; 
        const tree = parseSkinTree(skinString);
        let html = '<div class="skins-container">';
        let sortState = { foundMain: false };

        function renderRecursive(items, displayPrefix, keyPrefix) {
            let directSkins = [];
            let subCats = [];
            let firstIsString = (items.length > 0 && typeof items[0] === 'string');
            items.forEach(item => {
                if(typeof item === 'string') directSkins.push(item);
                else subCats.push(item);
            });
            if(firstIsString) {
                if(directSkins.length > 0) {
                    let catName = displayPrefix || "Misc.";
                    html += renderSkinGroup(catName, directSkins, char, sortState, keyPrefix || "");
                }
                subCats.forEach(cat => {
                    let newDisplay = displayPrefix ? `${displayPrefix} › ${cat.name}` : cat.name;
                    let newKey = keyPrefix ? `${keyPrefix}::${cat.name}` : cat.name;
                    renderRecursive(cat.items, newDisplay, newKey);
                });
            } else {
                subCats.forEach(cat => {
                    let newDisplay = displayPrefix ? `${displayPrefix} › ${cat.name}` : cat.name;
                    let newKey = keyPrefix ? `${keyPrefix}::${cat.name}` : cat.name;
                    renderRecursive(cat.items, newDisplay, newKey);
                });
                if(directSkins.length > 0) {
                    let catName = displayPrefix || "Misc.";
                    html += renderSkinGroup(catName, directSkins, char, sortState, keyPrefix || "");
                }
            }
        }

        renderRecursive(tree, "", "");
        return html + '</div>';
    }

    function renderSkinGroup(category, skinList, char, sortState, keyPath) {
        let html = `<div class="skin-group"><div class="skin-cat">${category}</div><div class="skin-tags">`;
        skinList.forEach(s => {
            const isFirst = !sortState.foundMain;
            if (isFirst) sortState.foundMain = true;

            const uniqueKey = keyPath ? keyPath + "::" + s : s;

            let cssClass = 'skin-pill'; 
            let dataAttrs = `data-id="${char.id}" data-name="${escapeSkinName(s)}" data-key="${escapeSkinName(uniqueKey)}"`; 
            let events = '';
            
            if (isFirst) { 
                cssClass += ' main-skin'; 
                dataAttrs += ` data-is-main="true"`; 
                events = `onclick="handleSkinClick(this)"`; 
            } else { 
                const isGwcog = s.toLowerCase().includes('gwcog') || category.toLowerCase().includes('gwcog'); 
                const data = (char.skinImages && (char.skinImages[uniqueKey] || char.skinImages[s])); 
                
                if(isGwcog) cssClass += ' gwcog'; 
                if(data) { 
                    cssClass += ' has-image'; 
                    dataAttrs += ` data-url="${data.url || data}" data-x="${data.x || 50}" data-y="${data.y || 50}" data-z="${data.z || 1}"`; 
                    events = `onclick="handleSkinClick(this)" onmouseenter="handleSkinHover(this, event)" onmouseleave="hideTooltip()" onmousemove="moveTooltip(event)"`; 
                } else { 
                    events = `onclick="handleSkinClick(this)"`; 
                }
            }
            html += `<span class="${cssClass}" ${dataAttrs} ${events}>${s}</span>`;
        });
        html += `</div></div>`; 
        return html;
    }

    function handleSkinClick(el) { 
        const id = parseInt(el.getAttribute('data-id')); 
        const name = el.getAttribute('data-name'); 
        const key = el.getAttribute('data-key') || name; 
        const isMain = el.getAttribute('data-is-main') === 'true'; 
        openSkinModal(id, name, isMain, key); 
    }

    function handleSkinHover(el, e) { 
        const url = el.getAttribute('data-url'); 
        const x = el.getAttribute('data-x'); 
        const y = el.getAttribute('data-y'); 
        const z = el.getAttribute('data-z') || 1; 
        if(url) showTooltip(e, url, x, y, z); 
    }
    
    function hideTooltip() { document.getElementById('skinTooltip').style.display = 'none'; }
    function moveTooltip(e) { 
        const tooltip = document.getElementById('skinTooltip'); 
        tooltip.style.left = (e.clientX + 15) + 'px'; 
        tooltip.style.top = (e.clientY + 15) + 'px'; 
    }
    function showTooltip(e, url, x, y, z) { 
        const tooltip = document.getElementById('skinTooltip'); 
        const tooltipImg = document.getElementById('skinTooltipImg'); 
        tooltipImg.src = url; 
        tooltipImg.style.objectPosition = `${x}% ${y}%`; 
        tooltipImg.style.transform = `scale(${z})`; 
        tooltipImg.style.transformOrigin = `${x}% ${y}%`; 
        tooltip.style.display = 'block'; 
        moveTooltip(e); 
    }

    async function openSkinModal(charId, skinName, isMainImage, uniqueKey) {
        const chars = await getChars();
        const char = chars.find(c => c.id === charId); 
        let url;
        
        document.getElementById('skinModalNameDisplay').innerText = skinName; 
        
        const data = (char.skinImages && (char.skinImages[uniqueKey] || char.skinImages[skinName])) || {}; 
        const fApp = data.firstApp || "";
        const blurb = data.blurb || "";
        
        const metaContainer = document.getElementById('skinMetadataDisplay');
        if (metaContainer) {
            if (fApp || blurb) {
                metaContainer.style.display = 'block';
                document.getElementById('skinFirstAppDisplayContainer').style.display = fApp ? 'block' : 'none';
                document.getElementById('skinFirstAppDisplay').innerText = fApp;
                document.getElementById('skinBlurbDisplayContainer').style.display = blurb ? 'block' : 'none';
                document.getElementById('skinBlurbDisplay').innerText = blurb;
            } else {
                metaContainer.style.display = 'none';
            }
        }

        if (isMainImage) { 
            document.getElementById('skinModalNameDisplay').innerText = skinName + " (Main)"; 
            if(metaContainer) metaContainer.style.display = 'none';
            url = char.img; 
        } else { 
            if(data.url || typeof data === 'string') {
                url = (typeof data === 'string') ? data : data.url; 
            }
        }
        
        if(url) { 
            const prev = document.getElementById('skinPreviewImg'); 
            const prevWrapper = prev.parentElement;
            
            prev.src = url; 
            prev.style.objectFit = 'contain'; 
            prev.style.objectPosition = 'center'; 
            prev.style.transform = 'none'; 
            
            prev.style.aspectRatio = 'auto';
            prev.style.width = 'auto';
            prev.style.maxWidth = '100%';
            prev.style.background = 'transparent';
            prev.style.border = 'none';
            
            prevWrapper.style.aspectRatio = 'auto';
            prevWrapper.style.background = 'transparent';
            prevWrapper.style.border = 'none';
            prevWrapper.style.display = 'flex';
            prevWrapper.style.justifyContent = 'center';
            
            document.getElementById('skinViewArea').style.display = 'block'; 
            document.getElementById('skinOverlay').classList.add('active');
        }
    }

    async function handleSearch() { 
        const query = document.getElementById('search').value.trim(); 
        if(query.length > 0) { 
            if (currentView !== 'search') {
                pushNavigationHistory({ view: 'search', search: query, openCharId: null }, "");
            }
            currentView = 'search'; 
            await renderMainView(); 
        } else { 
            if (currentView === 'search' && navigationHistory.length > 0) {
                await goBack();
            } else {
                currentView = 'home'; 
                selectedFranchise = null; 
                selectedActor = null;
                await renderMainView(); 
            }
        } 
    }

    async function verifyCharacterLbos(char) {
        if (!char.lbo || !Array.isArray(char.lbo)) return;

        let actorCredits = null;
        if (char.actor && char.actor !== 'None') {
            try {
                const searchRes = await fetch(`https://api.themoviedb.org/3/search/person?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(char.actor)}`);
                const searchData = await searchRes.json();
                if (searchData.results && searchData.results.length > 0) {
                    const personId = searchData.results[0].id;
                    const creditsRes = await fetch(`https://api.themoviedb.org/3/person/${personId}/combined_credits?api_key=${TMDB_API_KEY}`);
                    const creditsData = await creditsRes.json();
                    actorCredits = creditsData.cast;
                }
            } catch (e) {}
        }

        for (let i = 0; i < char.lbo.length; i++) {
            const lboItem = char.lbo[i];
            if (!lboItem.media) continue;

            const btnEl = document.getElementById(`media-btn-${char.id}-${i}`);
            if (!btnEl) continue;

            const yearMatch = lboItem.media.match(/\s*\((\d{4})\)\s*$/);
            const lboYear = yearMatch ? yearMatch[1] : null;
            const parenMatch = lboItem.media.match(/\s*\(([^)]+)\)\s*$/);
            let isTvHint = false;
            
            if (parenMatch) {
                const inside = parenMatch[1].toLowerCase();
                if (inside.includes('tv') || inside.includes('series') || inside.includes('season')) isTvHint = true;
            }
            
            const cleanTitle = lboItem.media.replace(/\s*\([^)]*\)\s*$/, '').trim().toLowerCase();
            let noPunctLbo = cleanTitle.replace(/[^\w\s]/g, ' ').replace(/\s+/g, ' ').trim();
            if (noPunctLbo.startsWith('the ')) noPunctLbo = noPunctLbo.substring(4).trim();

            let matchedId = null;
            let matchedType = null;

            const cachedCrew = findCrewInCache(lboItem.media);
            if (cachedCrew && cachedCrew.id && cachedCrew.type) {
                btnEl.style.display = 'inline-block';
                btnEl.onclick = (e) => {
                    e.stopPropagation();
                    viewMediaPage(cachedCrew.id, cachedCrew.type, lboItem.media, char.id);
                };
                continue;
            }

            if (actorCredits) {
                for (let credit of actorCredits) {
                    const isExcludedGenre = credit.genre_ids && credit.genre_ids.some(id => [99, 10763, 10764, 10767].includes(id));
                    const roleName = (credit.character || "").toLowerCase();
                    const isSelf = roleName === 'self' || roleName.includes('himself') || roleName.includes('herself');
                    
                    if (isExcludedGenre || isSelf) continue;

                    const creditTitle = (credit.title || credit.name || "").trim().toLowerCase();
                    const releaseDateStr = credit.release_date || credit.first_air_date || "";
                    const creditYear = releaseDateStr ? releaseDateStr.substring(0, 4) : null;
                    const creditType = credit.media_type;

                    let noPunctCredit = creditTitle.replace(/[^\w\s]/g, ' ').replace(/\s+/g, ' ').trim();
                    if (noPunctCredit.startsWith('the ')) noPunctCredit = noPunctCredit.substring(4).trim();

                    const isMatch = (
                        noPunctLbo === noPunctCredit || 
                        creditTitle.endsWith(': ' + cleanTitle) || 
                        creditTitle.endsWith(' - ' + cleanTitle) ||
                        noPunctCredit.endsWith(' and ' + noPunctLbo) ||
                        noPunctCredit.endsWith(' and the ' + noPunctLbo)
                    );

                    if (isMatch) {
                        if (lboYear && lboYear !== creditYear) continue;
                        if (isTvHint && creditType !== 'tv') continue;
                        
                        matchedId = credit.id;
                        matchedType = creditType;
                        break;
                    }
                }
            }

            if (!matchedId) {
                try {
                    const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(cleanTitle)}`);
                    const data = await res.json();
                    let validResults = data.results.filter(r => r.media_type === 'movie' || r.media_type === 'tv');
                    if (isTvHint) validResults = validResults.filter(r => r.media_type === 'tv');
                    
                    let item = null;
                    if (lboYear) {
                        item = validResults.find(r => {
                            let d = r.release_date || r.first_air_date || "";
                            let t = (r.title || r.name || "").trim().toLowerCase();
                            return d.startsWith(lboYear) && t === cleanTitle;
                        });
                        if (!item) {
                            item = validResults.find(r => {
                                let d = r.release_date || r.first_air_date || "";
                                return d.startsWith(lboYear);
                            });
                        }
                    }
                    if (!item && validResults.length > 0) item = validResults[0];

                    if (item) {
                        const itemTitle = (item.title || item.name || "").trim().toLowerCase();
                        let noPunctItem = itemTitle.replace(/[^\w\s]/g, ' ').replace(/\s+/g, ' ').trim();
                        if (noPunctItem.startsWith('the ')) noPunctItem = noPunctItem.substring(4).trim();

                        const isMatch = (
                            noPunctLbo === noPunctItem || 
                            itemTitle.includes(': ' + cleanTitle) || 
                            itemTitle.includes(' - ' + cleanTitle) ||
                            noPunctItem.includes(' and ' + noPunctLbo) ||
                            noPunctItem.includes(' and the ' + noPunctLbo)
                        );

                        if (isMatch || cleanTitle === itemTitle) { 
                            matchedId = item.id;
                            matchedType = item.media_type;
                        }
                    }
                } catch (e) {}
            }

            if (matchedId) {
                btnEl.style.display = 'inline-block';
                btnEl.onclick = (e) => {
                    e.stopPropagation();
                    viewMediaPage(matchedId, matchedType, lboItem.media, char.id);
                };
            } else {
                btnEl.remove();
            }
        }
    }

    async function viewMediaPage(id, type, name, charId = null) {
        pushNavigationHistory({ view: 'media_page', mediaTmdbId: id, mediaTmdbType: type, mediaName: name, mediaCharId: charId, openCharId: null });
        if (currentlyOpenCharId) closePageDirect();
        currentView = 'media_page';
        selectedMediaTmdbId = id;
        selectedMediaTmdbType = type;
        selectedMediaName = name;
        selectedMediaCharId = charId;
        await renderMainView();
    }
